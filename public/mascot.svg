<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- 漫画风格 IP：戴耳机的代码小怪兽 -->
  <!-- 天线 -->
  <line x1="100" y1="30" x2="100" y2="50" stroke="#2D2D2D" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="26" r="7" fill="#FFE66D" stroke="#2D2D2D" stroke-width="4"/>
  <!-- 身体（圆角矩形，珊瑚红 + 粗黑描边） -->
  <rect x="38" y="50" width="124" height="122" rx="30" fill="#FF6B6B" stroke="#2D2D2D" stroke-width="5"/>
  <!-- 耳机头带 -->
  <path d="M55 96 Q100 54 145 96" stroke="#2D2D2D" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- 耳罩（柠檬黄） -->
  <rect x="42" y="90" width="24" height="36" rx="9" fill="#FFE66D" stroke="#2D2D2D" stroke-width="5"/>
  <rect x="134" y="90" width="24" height="36" rx="9" fill="#FFE66D" stroke="#2D2D2D" stroke-width="5"/>
  <!-- 眼睛 -->
  <circle cx="82" cy="106" r="12" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="4"/>
  <circle cx="118" cy="106" r="12" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="4"/>
  <circle cx="84" cy="108" r="5.5" fill="#2D2D2D"/>
  <circle cx="120" cy="108" r="5.5" fill="#2D2D2D"/>
  <circle cx="86" cy="106" r="1.8" fill="#FFFFFF"/>
  <circle cx="122" cy="106" r="1.8" fill="#FFFFFF"/>
  <!-- 腮红 -->
  <circle cx="66" cy="128" r="7" fill="#FF8E8E" opacity="0.55"/>
  <circle cx="134" cy="128" r="7" fill="#FF8E8E" opacity="0.55"/>
  <!-- 嘴巴（微笑） -->
  <path d="M82 132 Q100 148 118 132" stroke="#2D2D2D" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- 胸前代码符号 -->
  <text x="100" y="163" font-family="monospace" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">&lt;/&gt;</text>
</svg>
